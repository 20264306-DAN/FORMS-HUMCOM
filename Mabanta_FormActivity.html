<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Mabanta — HTML Form Activity</title> </head> <body> <h1>HTML Form</h1>
<form action="#" method="post">

    <fieldset>
        <legend>Personal Information</legend>

        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </p>
    </fieldset>

    <br>

    <fieldset>
        <legend>Gender</legend>

        <p>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">

            <br>

            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female">

            <br>

            <label for="other">Other</label>
            <input type="radio" id="other" name="gender" value="other">
        </p>
    </fieldset>

    <br>

    <fieldset>
        <legend>Hobbies</legend>

        <p>
            <label for="drawing">Drawing</label>
            <input type="checkbox" id="drawing" name="hobby" value="drawing">

            <br>

            <label for="writing">Writing</label>
            <input type="checkbox" id="writing" name="hobby" value="writing">

            <br>

            <label for="singing">Singing</label>
            <input type="checkbox" id="singing" name="hobby" value="singing">
        </p>
    </fieldset>

    <br>

    <p>
        <label for="comments">Comments</label>
        <br>
        <textarea id="comments" name="comments" rows="3" cols="40"></textarea>
    </p>

    <p>
        <button type="submit">Submit</button>
    </p>

</form>

</body> </html>
